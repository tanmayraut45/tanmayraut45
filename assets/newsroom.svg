<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Industrial Briefs Newsroom live ops panel">
  <title>Industrial Briefs Newsroom — Live Ops</title>
  <desc>A CRT-terminal style status panel showing 10 agents with state, queue depth, and last heartbeat.</desc>

  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0a0e0a"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#c0caf5" stroke-width="1" opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background + scanline overlay -->
  <rect width="880" height="360" fill="#0a0e0a"/>
  <rect width="880" height="360" fill="url(#scanlines)"/>

  <!-- Outer frame -->
  <rect x="0.5" y="0.5" width="879" height="359" fill="none" stroke="#38bdae" stroke-width="1" opacity="0.35"/>

  <!-- Top strip -->
  <rect x="0" y="0" width="880" height="36" fill="#38bdae" opacity="0.08"/>
  <line x1="0" y1="36" x2="880" y2="36" stroke="#38bdae" stroke-width="1" opacity="0.4"/>
  <text x="20" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdae">INDUSTRIAL BRIEFS NEWSROOM</text>
  <text x="246" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.6">·</text>
  <text x="258" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">LIVE OPS</text>
  <text x="332" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.6">·</text>
  <text x="344" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdae">9/10 nominal</text>
  <text x="456" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.6">·</text>
  <text x="468" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.7">updated 2m ago</text>

  <!-- Column headers -->
  <text x="20" y="58" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#c0caf5" opacity="0.45">AGENT</text>
  <text x="180" y="58" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#c0caf5" opacity="0.45">STATE</text>
  <text x="380" y="58" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#c0caf5" opacity="0.45">QUEUE</text>
  <text x="560" y="58" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#c0caf5" opacity="0.45">LAST HEARTBEAT</text>
  <line x1="20" y1="64" x2="860" y2="64" stroke="#c0caf5" stroke-width="1" opacity="0.08"/>

  <!-- Row 1: scout -->
  <text x="20" y="86" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">scout</text>
  <circle cx="186" cy="82" r="5" fill="#38bdae"/>
  <text x="200" y="86" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdae">active</text>
  <text x="380" y="86" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="86" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">12</text>
  <text x="560" y="86" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="86" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">2s ago</text>

  <!-- Row 2: researcher -->
  <text x="20" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">researcher</text>
  <circle cx="186" cy="106" r="5" fill="#38bdae"/>
  <text x="200" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdae">active</text>
  <text x="380" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">3</text>
  <text x="560" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">8s ago</text>

  <!-- Row 3: writer -->
  <text x="20" y="134" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">writer</text>
  <circle cx="186" cy="130" r="5" fill="#38bdae"/>
  <text x="200" y="134" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.75">idle</text>
  <text x="380" y="134" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="134" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">0</text>
  <text x="560" y="134" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="134" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">1m ago</text>

  <!-- Row 4: editor -->
  <text x="20" y="158" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">editor</text>
  <circle cx="186" cy="154" r="5" fill="#38bdae"/>
  <text x="200" y="158" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdae">active</text>
  <text x="380" y="158" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="158" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">2</text>
  <text x="560" y="158" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="158" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">14s ago</text>

  <!-- Row 5: fact-check -->
  <text x="20" y="182" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">fact-check</text>
  <circle cx="186" cy="178" r="5" fill="#38bdae"/>
  <text x="200" y="182" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.75">idle</text>
  <text x="380" y="182" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="182" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">0</text>
  <text x="560" y="182" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="182" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">4m ago</text>

  <!-- Row 6: publisher -->
  <text x="20" y="206" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">publisher</text>
  <circle cx="186" cy="202" r="5" fill="#38bdae"/>
  <text x="200" y="206" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.75">idle</text>
  <text x="380" y="206" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="206" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">0</text>
  <text x="560" y="206" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="206" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">22m ago</text>

  <!-- Row 7: distributor (down) -->
  <text x="20" y="230" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">distributor</text>
  <circle cx="186" cy="226" r="5" fill="none" stroke="#f7768e" stroke-width="1.5"/>
  <text x="200" y="230" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#f7768e">down</text>
  <text x="380" y="230" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="230" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#f7768e">—</text>
  <text x="560" y="230" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="230" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#f7768e">18h ago</text>

  <!-- Row 8: analyst -->
  <text x="20" y="254" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">analyst</text>
  <circle cx="186" cy="250" r="5" fill="#38bdae"/>
  <text x="200" y="254" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.75">idle</text>
  <text x="380" y="254" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="254" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">0</text>
  <text x="560" y="254" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="254" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">3h ago</text>

  <!-- Row 9: archivist -->
  <text x="20" y="278" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">archivist</text>
  <circle cx="186" cy="274" r="5" fill="#38bdae"/>
  <text x="200" y="278" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdae">active</text>
  <text x="380" y="278" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="278" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">1</text>
  <text x="560" y="278" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="278" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">47s ago</text>

  <!-- Row 10: profile (special, pulsing) -->
  <text x="20" y="302" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">profile</text>
  <circle cx="186" cy="298" r="10" fill="#38bdae">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="302" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.75">idle</text>
  <text x="380" y="302" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">queue:</text>
  <text x="448" y="302" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">0</text>
  <text x="560" y="302" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.55">last:</text>
  <text x="612" y="302" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5">18h ago</text>
  <text x="700" y="302" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-style="italic" fill="#c0caf5" opacity="0.5">&#8592; writes me</text>

  <!-- Bottom strip -->
  <line x1="0" y1="324" x2="880" y2="324" stroke="#38bdae" stroke-width="1" opacity="0.4"/>
  <rect x="0" y="324" width="880" height="36" fill="#38bdae" opacity="0.08"/>
  <text x="20" y="347" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.75">today:</text>
  <text x="76" y="347" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdae">14 briefs published</text>
  <text x="234" y="347" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.6">·</text>
  <text x="246" y="347" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdae">312k tokens</text>
  <text x="346" y="347" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c0caf5" opacity="0.6">·</text>
  <text x="358" y="347" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdae">queue depth healthy</text>
</svg>
