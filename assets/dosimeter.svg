<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Personal Dosimeter Badge">
  <title>Personal Dosimeter Badge — TR-2026-Q2</title>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23243a"/>
      <stop offset="1" stop-color="#16172a"/>
    </linearGradient>
    <linearGradient id="filmstrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1020"/>
      <stop offset="1" stop-color="#1a1b27"/>
    </linearGradient>
    <linearGradient id="innerShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.08" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Outer panel / bezel -->
