  <rect x="1" y="1" width="878" height="258" rx="6" ry="6" fill="url(#bezel)" stroke="#2d2e3f" stroke-width="2"/>
  <rect x="2" y="2" width="876" height="256" rx="5" ry="5" fill="url(#innerShadow)" pointer-events="none"/>

  <!-- Clip tab (badge clip on top) -->
