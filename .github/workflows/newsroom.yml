name: newsroom

# Regenerates the NEWSROOM block in README.md once per day with a
# 2-paragraph "subject: tanmay" briefing in editorial voice.

on:
  schedule:
    # 4pm UTC = 9:30pm IST
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install --quiet requests

      - name: fetch last 7d activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: tanmayraut45
        run: |
          set -euo pipefail
          mkdir -p .cache
          SINCE=$(python -c "import datetime; print((datetime.datetime.utcnow() - datetime.timedelta(days=7)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          gh api graphql -f query='
            query($login: String!, $since: GitTimestamp!) {
              user(login: $login) {
                contributionsCollection(from: $since) {
                  totalCommitContributions
                  totalPullRequestContributions
                  commitContributionsByRepository(maxRepositories: 25) {
                    repository { nameWithOwner }
                    contributions(first: 50) {
                      nodes { commitCount occurredAt }
                    }
                  }
                  pullRequestContributions(first: 50) {
                    nodes {
                      pullRequest {
                        title
                        url
                        repository { nameWithOwner }
                        state
                        merged
                        createdAt
                      }
                    }
                  }
                  issueContributions(first: 25) {
                    nodes {
                      issue {
                        title
                        url
                        repository { nameWithOwner }
                        state
                      }
                    }
                  }
                }
              }
            }
          ' -f login="$GH_USER" -f since="$SINCE" > .cache/contrib7d.json || echo '{}' > .cache/contrib7d.json

          gh api "users/$GH_USER/events/public" --jq '[.[] | select(.type=="PushEvent") | {repo: .repo.name, created_at: .created_at, commits: [.payload.commits[]?.message]}]' > .cache/events7d.json || echo '[]' > .cache/events7d.json

      - name: build prompt and call groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python <<'PY'
          import json, os, datetime, pathlib, sys
          import requests

          contrib = json.load(open('.cache/contrib7d.json'))
          events  = json.load(open('.cache/events7d.json'))

          # Filter to last 7d
          cutoff = datetime.datetime.utcnow() - datetime.timedelta(days=7)
          recent = []
          for e in events:
              try:
                  ts = datetime.datetime.strptime(e['created_at'], '%Y-%m-%dT%H:%M:%SZ')
                  if ts >= cutoff:
                      recent.append(e)
              except Exception:
                  pass

          # Build sanitized activity log
          allowed_repos = set()
          allowed_pr_ids = set()
          lines = []
          totals = {"commits": 0, "prs": 0}

          try:
              cc = contrib['data']['user']['contributionsCollection']
              totals["commits"] = cc.get('totalCommitContributions', 0) or 0
              totals["prs"]     = cc.get('totalPullRequestContributions', 0) or 0
              for r in cc.get('commitContributionsByRepository', []):
                  repo = r['repository']['nameWithOwner']
                  total = sum(n['commitCount'] for n in r['contributions']['nodes'])
                  if total > 0:
                      allowed_repos.add(repo)
                      lines.append(f"repo {repo}: {total} commit(s) over the window")
              for pr in cc.get('pullRequestContributions', {}).get('nodes', []):
                  p = pr['pullRequest']
                  repo = p['repository']['nameWithOwner']
                  pr_num = p['url'].rsplit('/', 1)[-1]
                  allowed_repos.add(repo)
                  allowed_pr_ids.add(f"{repo}#{pr_num}")
                  status = "merged" if p.get('merged') else p.get('state', 'unknown').lower()
                  title = p['title'].replace('\n', ' ').strip()[:140]
                  lines.append(f"pr {repo}#{pr_num} [{status}]: {title}")
              for iss in cc.get('issueContributions', {}).get('nodes', []):
                  i = iss['issue']
                  repo = i['repository']['nameWithOwner']
                  allowed_repos.add(repo)
                  title = i['title'].replace('\n', ' ').strip()[:140]
                  lines.append(f"issue {repo} [{i.get('state','').lower()}]: {title}")
          except Exception as ex:
              print(f"contrib parse warn: {ex}", file=sys.stderr)

          for e in recent:
              allowed_repos.add(e['repo'])
              for msg in e.get('commits', [])[:8]:
                  m = msg.replace('\n', ' ').replace('\r', ' ').strip()[:180]
                  if m:
                      lines.append(f"commit {e['repo']}: {m}")

          activity = "\n".join(lines) if lines else "(no public activity in the last 7 days)"

          today = datetime.date.today().isoformat()
          allowed_repo_list = ", ".join(sorted(allowed_repos)) or "(none)"
          allowed_pr_list   = ", ".join(sorted(allowed_pr_ids)) or "(none)"

          system = (
              "you are profile-agent, a desk reporter in the industrial briefs "
              "newsroom. you write 2-paragraph briefings about a single subject "
              "in the dry editorial voice of a financial-news wire. "
              "rules: "
              "lowercase, short sentences, factual, no hype, no exclamations, "
              "no second-person, no 'we', no 'i'. third-person only. "
              "you may ONLY cite repos and pr ids that appear in the explicit "
              "allowed-list provided. if you have nothing concrete to report, "
              "say so plainly in one paragraph and stop. "
              "do not invent metrics, deal sizes, customers, or outcomes. "
              "do not editorialize. "
              "your output is exactly 2 paragraphs separated by a blank line "
              "and nothing else (no headings, no bullets, no signature)."
          )
          user = (
              f"subject: tanmay raut (github: tanmayraut45)\n"
              f"window: last 7 days, ending {today} UTC\n"
              f"totals: {totals['commits']} commit contributions, {totals['prs']} pr contributions\n"
              f"allowed repos: {allowed_repo_list}\n"
              f"allowed pr ids: {allowed_pr_list}\n\n"
              f"activity log (the only source of truth):\n{activity}\n\n"
              f"write the 2-paragraph briefing."
          )

          fallback_path = pathlib.Path('.cache/last_newsroom.txt')

          def write_block(body: str, stale: bool = False):
              suffix = "  _(api unavailable)_" if stale else ""
              sig = f"— drafted by profile-agent · n8n exec sim · {today} IST{suffix}"
              md = f"**subject: tanmay · {today}**\n\n{body.strip()}\n\n{sig}\n"
              pathlib.Path('.cache/newsroom_block.txt').write_text(md, encoding='utf-8')

          api_key = os.environ.get('GROQ_API_KEY', '').strip()
          if not api_key:
              print("no groq key, using fallback", file=sys.stderr)
              prev = fallback_path.read_text(encoding='utf-8') if fallback_path.exists() else "no public activity reported."
              write_block(prev, stale=True)
              sys.exit(0)

          try:
              resp = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                  },
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {"role": "system", "content": system},
                          {"role": "user", "content": user},
                      ],
                      "temperature": 0.35,
                      "max_tokens": 600,
                  },
                  timeout=45,
              )
              resp.raise_for_status()
              body = resp.json()["choices"][0]["message"]["content"].strip()
              if not body:
                  raise RuntimeError("empty response")
              fallback_path.write_text(body, encoding='utf-8')
              write_block(body, stale=False)
          except Exception as ex:
              print(f"groq call failed: {ex}", file=sys.stderr)
              prev = fallback_path.read_text(encoding='utf-8') if fallback_path.exists() else "no public activity reported."
              write_block(prev, stale=True)
          PY

      - name: inject into README between markers
        run: |
          python <<'PY'
          import pathlib, re
          readme_path = pathlib.Path('README.md')
          block = pathlib.Path('.cache/newsroom_block.txt').read_text(encoding='utf-8')
          start = '<!-- NEWSROOM:START -->'
          end   = '<!-- NEWSROOM:END -->'
          text = readme_path.read_text(encoding='utf-8') if readme_path.exists() else ''
          new_section = f"{start}\n{block}\n{end}"
          if start in text and end in text:
              text = re.sub(
                  re.escape(start) + r'.*?' + re.escape(end),
                  new_section,
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
          else:
              sep = '' if text.endswith('\n') else '\n'
              text = text + sep + '\n' + new_section + '\n'
          readme_path.write_text(text, encoding='utf-8')
          PY

      - name: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "no changes to README.md"
            exit 0
          fi
          git add README.md
          git commit -m "newsroom: $(date -u -I)"
          git push
