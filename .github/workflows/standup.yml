name: standup

# Generates today's standup paragraph from last 24h of commits.
# Writes between <!-- STANDUP:START --> and <!-- STANDUP:END --> in README.md.

on:
  schedule:
    # 3am UTC = 8:30am IST
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standup
  cancel-in-progress: false

jobs:
  standup:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install --quiet requests

      - name: fetch last 24h commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: tanmayraut45
        run: |
          set -euo pipefail
          mkdir -p .cache
          SINCE=$(python -c "import datetime; print((datetime.datetime.utcnow() - datetime.timedelta(hours=24)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          echo "since=$SINCE"
          gh api graphql -f query='
            query($login: String!, $since: GitTimestamp!) {
              user(login: $login) {
                contributionsCollection(from: $since) {
                  commitContributionsByRepository(maxRepositories: 25) {
                    repository { nameWithOwner }
                    contributions(first: 50) {
                      nodes {
                        commitCount
                        occurredAt
                      }
                    }
                  }
                  pullRequestContributions(first: 25) {
                    nodes {
                      pullRequest {
                        title
                        url
                        repository { nameWithOwner }
                        state
                      }
                    }
                  }
                }
              }
            }
          ' -f login="$GH_USER" -f since="$SINCE" > .cache/contrib.json || echo '{}' > .cache/contrib.json

          # Also pull recent commit messages from public events (best-effort, plain REST)
          gh api "users/$GH_USER/events/public" --jq '[.[] | select(.type=="PushEvent") | {repo: .repo.name, created_at: .created_at, commits: [.payload.commits[]?.message]}]' > .cache/events.json || echo '[]' > .cache/events.json

      - name: build prompt and call groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python <<'PY'
          import json, os, datetime, pathlib, sys
          import requests

          contrib = json.load(open('.cache/contrib.json'))
          events = json.load(open('.cache/events.json'))

          # Filter events to last 24h
          cutoff = datetime.datetime.utcnow() - datetime.timedelta(hours=24)
          recent = []
          for e in events:
              try:
                  ts = datetime.datetime.strptime(e['created_at'], '%Y-%m-%dT%H:%M:%SZ')
                  if ts >= cutoff:
                      recent.append(e)
              except Exception:
                  pass

          # Build a compact, sanitized input string for the LLM
          lines = []
          try:
              cc = contrib['data']['user']['contributionsCollection']
              for r in cc.get('commitContributionsByRepository', []):
                  repo = r['repository']['nameWithOwner']
                  total = sum(n['commitCount'] for n in r['contributions']['nodes'])
                  if total > 0:
                      lines.append(f"repo {repo}: {total} commit(s)")
              for pr in cc.get('pullRequestContributions', {}).get('nodes', []):
                  p = pr['pullRequest']
                  lines.append(f"pr {p['repository']['nameWithOwner']}#{p['url'].rsplit('/',1)[-1]} [{p['state']}]: {p['title'][:120]}")
          except Exception as ex:
              print(f"contrib parse warn: {ex}", file=sys.stderr)

          for e in recent:
              for msg in e.get('commits', [])[:10]:
                  # sanitize: strip newlines and markdown control chars
                  m = msg.replace('\n', ' ').replace('\r', ' ').strip()[:160]
                  if m:
                      lines.append(f"commit {e['repo']}: {m}")

          activity = "\n".join(lines) if lines else "(no commits or prs in last 24h)"
          print("---ACTIVITY---")
          print(activity)
          print("---END---")

          system = (
              "you are a terse standup-bot. you write a 4-section daily standup "
              "with sections: shipped / blocked / next / energy. "
              "rules: lowercase only. fragments ok. dry, direct. "
              "no exclamation marks. no platitudes. no 'excited to share'. "
              "max 1 line per section. "
              "you MUST only reference repos, prs, or work items that appear "
              "verbatim in the user-provided activity log. "
              "do NOT invent repo names, pr numbers, or accomplishments. "
              "if the activity log says 'no commits or prs in last 24h', "
              "your entire output is exactly: 'nothing shipped' "
              "(no sections, no extra words)."
          )
          user = f"activity log for the last 24 hours:\n\n{activity}\n\nwrite the standup."

          today = datetime.date.today().isoformat()
          fallback_path = pathlib.Path('.cache/last_standup.txt')

          def write_block(body: str):
              # Build the markdown block to inject between markers
              md = f"**standup · {today}**\n\n{body.strip()}\n"
              pathlib.Path('.cache/standup_block.txt').write_text(md, encoding='utf-8')

          api_key = os.environ.get('GROQ_API_KEY', '').strip()
          if not api_key:
              print("no groq key, using fallback", file=sys.stderr)
              prev = fallback_path.read_text(encoding='utf-8') if fallback_path.exists() else "nothing shipped"
              write_block(prev + "\n\n_(api unavailable)_")
              sys.exit(0)

          try:
              resp = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                  },
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {"role": "system", "content": system},
                          {"role": "user", "content": user},
                      ],
                      "temperature": 0.3,
                      "max_tokens": 400,
                  },
                  timeout=30,
              )
              resp.raise_for_status()
              body = resp.json()["choices"][0]["message"]["content"].strip()
              if not body:
                  raise RuntimeError("empty response")
              fallback_path.write_text(body, encoding='utf-8')
              write_block(body)
          except Exception as ex:
              print(f"groq call failed: {ex}", file=sys.stderr)
              prev = fallback_path.read_text(encoding='utf-8') if fallback_path.exists() else "nothing shipped"
              write_block(prev + "\n\n_(api unavailable)_")
          PY

      - name: inject into README between markers
        run: |
          python <<'PY'
          import pathlib, re
          readme_path = pathlib.Path('README.md')
          block = pathlib.Path('.cache/standup_block.txt').read_text(encoding='utf-8')
          start = '<!-- STANDUP:START -->'
          end   = '<!-- STANDUP:END -->'
          text = readme_path.read_text(encoding='utf-8') if readme_path.exists() else ''
          new_section = f"{start}\n{block}\n{end}"
          if start in text and end in text:
              text = re.sub(
                  re.escape(start) + r'.*?' + re.escape(end),
                  new_section,
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
          else:
              # append at end if markers missing
              sep = '' if text.endswith('\n') else '\n'
              text = text + sep + '\n' + new_section + '\n'
          readme_path.write_text(text, encoding='utf-8')
          PY

      - name: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "no changes to README.md"
            exit 0
          fi
          git add README.md
          git commit -m "standup: $(date -u -I)"
          git push
